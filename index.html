<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amot</title>
    <style>
        body { font-family: sans-serif; background: #f0f9ff; padding: 10px; }
      .box { max-width: 400px; margin: 0 auto; }
      .card { background: white; padding: 15px; border-radius: 15px; margin-bottom: 10px; }
        h1 { text-align: center; color: #0c4a6e; }
        select, button { width: 100%; padding: 15px; margin: 5px 0; border-radius: 10px; border: 1px solid #ccc; font-size: 16px; }
        button { background: #0284c7; color: white; border: none; font-weight: bold; }
     .result { background: #dcfce7; border: 2px solid #22c55e; padding: 15px; border-radius: 15px; text-align: center; display: none; }
     .price { font-size: 30px; font-weight: bold; color: #166534; }
    </style>
</head>
<body>
    <div class="box">
        <h1>AMOT</h1>
        <div class="card">
            <select id="kutoka">
                <option value="">Unatoka wapi?</option>
                <option value="stone town">Stone Town</option>
                <option value="airport">Airport</option>
            </select>
            <select id="kwenda">
                <option value="">Unakwenda wapi?</option>
                <option value="stone town">Stone Town</option>
                <option value="airport">Airport</option>
            </select>
            <button onclick="pataNauli()">Hesabu Nauli</button>
        </div>

        <div id="matokeo" class="result">
            <div>Nauli Yako</div>
            <div class="price" id="bei">TSh 0</div>
            <div id="details">Umbali: 7.6 km</div>
        </div>
    </div>

    <script>
        function pataNauli() {
            var k1 = document.getElementById('kutoka').value;
            var k2 = document.getElementById('kwenda').value;
            
            if (k1 === "" || k2 === "") {
                alert("Chagua sehemu zote mbili");
                return;
            }
            if (k1 === k2) {
                alert("Huwezi kwenda ulipo");
                return;
            }
            
            var nauli = 12400; // Stone Town > Airport = 7.6km * 1500 + 1000 = 12400
            
            document.getElementById('bei').innerHTML = "TSh " + nauli.toLocaleString();
            document.getElementById('matokeo').style.display = "block";
        }
    </script>
</body>
</html>
