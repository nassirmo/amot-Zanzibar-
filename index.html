<!DOCTYPE html>
<html>
<head>
    <title>Test Map</title>
    <style>
        #map { height: 400px; width: 100%; }
    </style>
</head>
<body>
    <h1>Kama unaona ramani hapa, Amot itafanya kazi</h1>
    <div id="map"></div>

    <script>
        function initMap() {
            new google.maps.Map(document.getElementById("map"), {
                center: { lat: -6.1659, lng: 39.2026 },
                zoom: 13,
            });
        }
    </script>
    
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBMzrL-oUkVDU14u15itY9q5pkiDMj2NFE&callback=initMap" async defer></script>
</body>
</html>
