<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amot Zanzibar</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a1a; padding: 20px; min-height: 100vh; }
.card { max-width: 420px; margin: 0 auto; background: white; border-radius: 20px; padding: 24px; }
.logo-text { font-size: 28px; font-weight: 800; color: #00a651; text-align: center; margin-bottom: 8px; }
h2 { font-size: 22px; margin: 16px 0 20px; }
label { display: block; font-size: 15px; font-weight: 700; margin: 18px 0 8px; }
input, select { width: 100%; padding: 14px; font-size: 16px; border: 2px solid #e8eaed; border-radius: 12px; }
input:focus, select:focus { border-color: #00a651; outline: none; }
.trust-hint { font-size: 13px; color: #00a651; background: #f0fdf4; padding: 10px; border-radius: 8px; margin: 15px 0; font-weight: 600; }
.checkbox-row { display: flex; align-items: center; margin: 18px 0; }
.checkbox-row input { width: 20px; height: 20px; margin-right: 10px; }
.payment-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 8px; }
.payment-btn { padding: 12px; border: none; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; color: white; }
.mpesa { background: #00a651; }.tigo { background: #0066cc; }
.airtel { background: #e31e24; }.halopesa { background: #ff6f00; }
.payment-btn.selected { box-shadow: 0 0 0 3px #1a1a1a; }
.btn-price, #btnLipa { width: 100%; padding: 16px; font-size: 17px; font-weight: 700; background: #00a651; color: white; border: none; border-radius: 12px; cursor: pointer; margin-top: 8px; }
#btnLipa { background: #d97706; display: none; }
#beiContainer { display: none; margin-top: 24px; padding: 20px; background: #f0fdf4; border-radius: 12px; border: 2px solid #00a651; }
.price-big { font-size: 28px; font-weight: 800; color: #00a651; text-align: center; }
.driver-info,.payment-info { margin-top: 12px; padding: 10px; border-radius: 8px; text-align: center; }
.driver-info { background: #fff3cd; }
.payment-info { background: #e3f2fd; border: 2px solid #0066cc; display: none; }
.chat-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; display: none; }
.chat-btn { padding: 12px; font-weight: 700; border: none; border-radius: 10px; cursor: pointer; color: white; }
.chat-mmiliki { background: #1a1a1a; }
.chat-dereva { background: #00a651; }
#map { height: 0; } /* Ficha ramani, tunatumia tu API */
</style>
</head>
<body>
<div class="card">
<div class="logo-text">Amot Zanzibar</div>
<h2>Book Your Ride</h2>

<div class="trust-hint">
✅ Dereva anafika 5-15 min • ✅ Lipa kwa dereva kwa taxi • ✅ Haraka na salama
</div>

<label>Namba yako ya Simu</label>
<input type="tel" id="mtejaPhone" placeholder="07XX XXX">

<label>Pick-up Location</label>
<input type="text" id="pickup" placeholder="Tafuta eneo...">

<label>Drop-off Location</label>
<input type="text" id="dropoff" placeholder="Tafuta eneo...">

<label>Distance</label>
<input type="text" id="distance" placeholder="Itajaza kiotomatiki" readonly>

<label>Vehicle Type</label>
<select id="vehicleType">
<option value="Bodaboda">Bodaboda - 1 Person</option>
<option value="Bajaji">Bajaji - 3 People</option>
<option value="Sedan">Sedan - 4 People</option>
<option value="Pickup">Pickup - Mizigo midogo</option>
<option value="Lorry">Lorry 3T - Mizigo mikubwa</option>
<option value="Fuso">Fuso 5T - Mizigo mizito</option>
</select>

<div class="checkbox-row">
<input type="checkbox" id="labor">
<label for="labor">I need loading labor (+TSh 5,000)</label>
</div>

<div id="paymentSection">
<div class="payment-title">Choose Payment Method:</div>
<div class="payment-grid">
<button type="button" class="payment-btn mpesa" onclick="chaguaMalipo('M-Pesa', this)">M-Pesa</button>
<button type="button" class="payment-btn tigo" onclick="chaguaMalipo('Tigo Pesa', this)">Tigo Pesa</button>
<button type="button" class="payment-btn airtel" onclick="chaguaMalipo('Airtel Money', this)">Airtel Money</button>
<button type="button" class="payment-btn halopesa" onclick="chaguaMalipo('Halopesa', this)">Halopesa</button>
</div>
<div class="selected-text" id="selectedText">Selected: None</div>
</div>

<button type="button" class="btn-price" onclick="hesabuBei()">Get Your Price</button>

<div id="beiContainer">
<div class="price-big">TZS <span id="onyeshaBei">0</span></div>
<div class="deposit" id="depositText"></div>
<div class="driver-info" id="driverInfo">Dereva atakutafuta mara baada ya kuthibitisha</div>

<div class="payment-info" id="paymentInfo">
<h4>LIPA DEPOSIT SASA</h4>
<p>Tuma TZS <span id="kiasiChaKulipa">0</span> kwenda:</p>
<div class="namba" id="nambaYaMalipo">07XX XXX</div>
</div>

<button type="button" id="btnLipa" onclick="lipaSasa()">NIMELIPA - TUMA UTHIBITISHO</button>

<div class="chat-buttons" id="chatButtons">
<button type="button" class="chat-btn chat-mmiliki" onclick="chatNaMmiliki()">Chat na Mmiliki</button>
<button type="button" class="chat-btn chat-dereva" onclick="chatNaDereva()">Chat na Dereva</button>
</div>
</div>
</div>

<div id="map"></div>

<script>
var njiaYaMalipo = "";
var beiYaMwisho = 0;
var depositAmount = 0;
var derevaAliyechaguliwa = null;
var anahitajiDeposit = false;
var pickupPlace = null;
var dropoffPlace = null;
var distanceKm = 0;

var NAMBA_YA_MMILIKI = "255779771085";
var NAMBA_ZA_MALIPO = {
"M-Pesa": "255712345678",
"Tigo Pesa": "255779771085",
"Airtel Money": "255783823722",
"Halopesa": "255625678901"
};

var madereva = [
{ jina: "chandimu", namba: "255776218038", eneo: "Stone Town", lat: -6.1659, lon: 39.1919 },
{ jina: "abuu machapati", namba: "255713333222", eneo: "Mwanakwerekwe", lat: -6.1717, lon: 39.2186 },
{ jina: "Hassan", namba: "255713333", eneo: "Nungwi", lat: -5.7261, lon: 39.2950 },
{ jina: "Mussa", namba: "255713333444", eneo: "Paje", lat: -6.2667, lon: 39.5333 },
{ jina: "Bakari", namba: "255713333555", eneo: "Airport", lat: -6.2186, lon: 39.2231 }
];

function initAutocomplete() {
var pickupInput = document.getElementById('pickup');
var dropoffInput = document.getElementById('dropoff');

var options = {
componentRestrictions: { country: 'tz' },
types: ['establishment', 'geocode']
};

var pickupAutocomplete = new google.maps.places.Autocomplete(pickupInput, options);
var dropoffAutocomplete = new google.maps.places.Autocomplete(dropoffInput, options);

pickupAutocomplete.addListener('place_changed', function() {
pickupPlace = pickupAutocomplete.getPlace();
hesabuNjia();
});

dropoffAutocomplete.addListener('place_changed', function() {
dropoffPlace = dropoffAutocomplete.getPlace();
hesabuNjia();
});
}

function hesabuNjia() {
if(!pickupPlace || !dropoffPlace) return;

var directionsService = new google.maps.DirectionsService();

directionsService.route({
origin: pickupPlace.geometry.location,
destination: dropoffPlace.geometry.location,
travelMode: google.maps.TravelMode.DRIVING
}, function(response, status) {
if(status === 'OK') {
distanceKm = response.routes[0].legs[0].distance.value / 1000;
document.getElementById('distance').value = distanceKm.toFixed(1) + ' km';
} else {
alert('Huwezi kupata njia. Jaribu tena.');
}
});
}

function chaguaMalipo(mtandao, element) {
njiaYaMalipo = mtandao;
var btns = document.querySelectorAll('.payment-btn');
for (var i = 0; i < btns.length; i++) {
btns[i].classList.remove('selected');
}
element.classList.add('selected');
document.getElementById('selectedText').innerText = 'Selected: ' + mtandao;
}

function hesabuBei() {
var phone = document.getElementById('mtejaPhone').value.trim();
var vehicle = document.getElementById('vehicleType').value;
var labor = document.getElementById('labor').checked;

if(phone === "") return alert("Tafadhali andika namba yako ya simu");
if(!pickupPlace) return alert("Chagua pickup location kutoka kwenye suggestions");
if(!dropoffPlace) return alert("Chagua dropoff location kutoka kwenye suggestions");
if(distanceKm <= 0) return alert("Umbali haujawekwa. Chagua tena sehemu");

var beiPerKm = 0, basePrice = 0;
if(vehicle === "Bodaboda") { basePrice = 500; beiPerKm = 600; }
if(vehicle === "Bajaji") { basePrice = 1000; beiPerKm = 1000; }
if(vehicle === "Sedan") { basePrice = 2000; beiPerKm = 1500; }
if(vehicle === "Pickup") { basePrice = 5000; beiPerKm = 2500; }
if(vehicle === "Lorry") { basePrice = 15000; beiPerKm = 4000; }
if(vehicle === "Fuso") { basePrice = 25000; beiPerKm = 6000; }

beiYaMwisho = Math.round(basePrice + (beiPerKm * distanceKm));
if(labor) beiYaMwisho += 5000;

anahitajiDeposit = (vehicle === "Pickup" || vehicle === "Lorry" || vehicle === "Fuso");

if(anahitajiDeposit) {
if(njiaYaMalipo === "") return alert("Chagua njia ya malipo kwanza kwa mizigo");
depositAmount = Math.round(beiYaMwisho * 0.3);
document.getElementById('depositText').innerText = "Deposit 30%: TZS " + depositAmount.toLocaleString();
document.getElementById('paymentSection').style.display = 'block';
document.getElementById('paymentInfo').style.display = 'block';
document.getElementById('kiasiChaKulipa').innerText = depositAmount.toLocaleString();
document.getElementById('nambaYaMalipo').innerText = NAMBA_ZA_MALIPO[njiaYaMalipo];
document.getElementById('btnLipa').style.display = 'block';
} else {
depositAmount = 0;
document.getElementById('depositText').innerText = "Lipa kwa dereva unapofika";
document.getElementById('paymentSection').style.display = 'none';
document.getElementById('paymentInfo').style.display = 'none';
document.getElementById('btnLipa').style.display = 'none';
}

derevaAliyechaguliwa = madereva[0]; // Unaweza kuweka logic ya karibu hapa baadaye

document.getElementById('onyeshaBei').innerText = beiYaMwisho.toLocaleString();
document.getElementById('driverInfo').innerText = 'Dereva atakutafuta mara baada ya kuthibitisha';
document.getElementById('beiContainer').style.display = 'block';
document.getElementById('chatButtons').style.display = 'none';
}

function lipaSasa() {
var msgKwako = "UTHIBITISHO WA MALIPO - Amot Zanzibar%0A%0A";
msgKwako += "Mteja: " + document.getElementById('mtejaPhone').value + "%0A";
msgKwako += "Kutoka: " + pickupPlace.formatted_address + "%0A";
msgKwako += "Kwenda: " + dropoffPlace.formatted_address + "%0A";
msgKwako += "Umbali: " + distanceKm.toFixed(1) + "km%0A";
msgKwako += "Jumla: TZS " + beiYaMwisho.toLocaleString() + "%0A";
msgKwako += "Deposit: TZS " + depositAmount.toLocaleString() + "%0A";
window.open('https://wa.me/' + NAMBA_YA_MMILIKI + '?text=' + msgKwako);
document.getElementById('chatButtons').style.display = 'grid';
}

function chatNaMmiliki() {
var msg = 'Chat na Mmiliki - ' + pickupPlace.formatted_address + ' to ' + dropoffPlace.formatted_address;
window.open('https://wa.me/' + NAMBA_YA_MMILIKI + '?text=' + encodeURIComponent(msg));
}

function chatNaDereva() {
var msg = 'Chat na Dereva - ' + pickupPlace.formatted_address + ' to ' + dropoffPlace.formatted_address;
window.open('https://wa.me/' + derevaAliyechaguliwa.namba + '?text=' + encodeURIComponent(msg));
}
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=https://sheetdb.io/api/v1/yn3j4gb8hupyl&libraries=places&callback=initAutocomplete" async defer></script>
</body>
</html>
