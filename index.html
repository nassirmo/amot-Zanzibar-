<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DukaPro - Mfumo wa Biashara</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #f8fafc; color: #0f172a; }
   .box { max-width: 600px; margin: 0 auto; padding: 10px; }
   .header { background: linear-gradient(135deg, #0ea5e9, #0284c7); color: white; padding: 20px; text-align: center; border-radius: 0 0 20px 20px; }
   .card { background: white; padding: 16px; border-radius: 16px; margin: 12px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        input, select, button { width: 100%; padding: 12px; margin: 6px 0; border-radius: 8px; border: 1px solid #e2e8f0; font-size: 15px; }
        button { background: #0ea5e9; color: white; border: none; font-weight: 700; cursor: pointer; }
   .btn-green { background: #22c55e!important; }
   .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
   .grid4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
   .kpi { text-align: center; padding: 12px; background: #f1f5f9; border-radius: 10px; }
   .kpi-num { font-size: 18px; font-weight: 800; color: #0ea5e9; }
   .kpi-label { font-size: 11px; color: #64748b; }
   .tabs { display: flex; background: #e2e8f0; border-radius: 10px; padding: 4px; margin: 15px 0; overflow-x: auto; }
   .tab { flex: 1; padding: 8px; text-align: center; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; }
   .tab.active { background: white; color: #0ea5e9; }
   .hidden { display: none; }
   .item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>DUKAPRO</h1>
        <p id="tarehe"></p>
    </div>

    <div class="box">
        <div class="tabs">
            <div class="tab active" data-tab="dashibodi">Dashibodi</div>
            <div class="tab" data-tab="uza">Uza</div>
            <div class="tab" data-tab="bidhaa">Bidhaa</div>
            <div class="tab" data-tab="matumizi">Matumizi</div>
        </div>

        <div id="tab-dashibodi">
            <div class="card">
                <div class="grid4">
                    <div class="kpi">
                        <div class="kpi-num" id="mauzoLeo">0</div>
                        <div class="kpi-label">Mauzo Leo</div>
                    </div>
                    <div class="kpi">
                        <div class="kpi-num" id="faidaLeo">0</div>
                        <div class="kpi-label">Faida Leo</div>
                    </div>
                    <div class="kpi">
                        <div class="kpi-num" id="madeni">0</div>
                        <div class="kpi-label">Madeni</div>
                    </div>
                    <div class="kpi">
                        <div class="kpi-num" id="faidaHalisi">0</div>
                        <div class="kpi-label">Faida Halisi</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="tab-uza" class="hidden">
            <div class="card">
                <h3>Rekodi Mauzo</h3>
                <input type="text" id="jinaMnunuzi" placeholder="Jina la Mnunuzi">
                <select id="chaguaBidhaa"></select>
                <div class="grid2">
                    <input type="number" id="idadi" placeholder="Idadi" value="1">
                    <input type="number" id="bei" placeholder="Bei ya Kuuza">
                </div>
                <input type="number" id="kilicholipwa" placeholder="Kilicholipwa">
                <button id="btnUza" class="btn-green">Rekodi Mauzo</button>
            </div>
        </div>

        <div id="tab-bidhaa" class="hidden">
            <div class="card">
                <h3>Ongeza Bidhaa</h3>
                <input type="text" id="jinaBidhaa" placeholder="Jina la Bidhaa">
                <div class="grid2">
                    <input type="number" id="beiKununua" placeholder="Bei Kununua">
                    <input type="number" id="beiKuuza" placeholder="Bei Kuuza">
                </div>
                <input type="number" id="stock" placeholder="Stock">
                <button id="btnOngezaBidhaa">Ongeza Bidhaa</button>
            </div>
            <div class="card">
                <h3>Bidhaa Zote</h3>
                <div id="orodhaBidhaa">Hakuna bidhaa</div>
            </div>
        </div>

        <div id="tab-matumizi" class="hidden">
            <div class="card">
                <h3>Rekodi Matumizi</h3>
                <select id="ainaMatumizi">
                    <option value="">Chagua Aina</option>
                    <option value="Mshahara">Mshahara</option>
                    <option value="Kodi Store">Kodi ya Store</option>
                    <option value="Kodi Serikali">Kodi ya Serikali</option>
                    <option value="Umeme">Umeme</option>
                </select>
                <input type="number" id="kiasiMatumizi" placeholder="Kiasi TSh">
                <button id="btnMatumizi">Rekodi Matumizi</button>
            </div>
        </div>
    </div>

    <script>
        let bidhaa = JSON.parse(localStorage.getItem('pro_bidhaa')) || [];
        let mauzo = JSON.parse(localStorage.getItem('pro_mauzo')) || [];
        let matumizi = JSON.parse(localStorage.getItem('pro_matumizi')) || [];

        document.getElementById('tarehe').innerText = new Date().toLocaleDateString('sw-TZ', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
        
        document.querySelectorAll('.tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
                document.querySelectorAll('[id^="tab-"]').forEach(function(t) { t.classList.add('hidden'); });
                this.classList.add('active');
                document.getElementById('tab-' + this.dataset.tab).classList.remove('hidden');
                updateUI();
            });
        });

        document.getElementById('btnOngezaBidhaa').addEventListener('click', function() {
            let b = {
                id: Date.now(),
                jina: document.getElementById('jinaBidhaa').value,
                beiKununua: parseFloat(document.getElementById('beiKununua').value) || 0,
                beiKuuza: parseFloat(document.getElementById('beiKuuza').value) || 0,
                stock: parseInt(document.getElementById('stock').value) || 0
            };
            if(!b.jina) { alert('Weka jina la bidhaa'); return; }
            bidhaa.push(b);
            localStorage.setItem('pro_bidhaa', JSON.stringify(bidhaa));
            document.getElementById('jinaBidhaa').value = '';
            document.getElementById('beiKununua').value = '';
            document.getElementById('beiKuuza').value = '';
            document.getElementById('stock').value = '';
            updateUI();
            alert('Bidhaa imeongezwa!');
        });

        document.getElementById('btnUza').addEventListener('click', function() {
            let bidhaaId = document.getElementById('chaguaBidhaa').value;
            let b = bidhaa.find(function(x) { return x.id == bidhaaId; });
            if(!b) { alert('Chagua bidhaa kwanza'); return; }
            
            let idadi = parseInt(document.getElementById('idadi').value) || 1;
            if(idadi > b.stock) { alert('Stock haitoshi. Iliyopo: ' + b.stock); return; }
            
            let bei = parseFloat(document.getElementById('bei').value) || b.beiKuuza;
            let kilicholipwa = parseFloat(document.getElementById('kilicholipwa').value) || 0;
            
            b.stock -= idadi;
            mauzo.push({
                id: Date.now(),
                tarehe: new Date().toISOString(),
                jinaMnunuzi: document.getElementById('jinaMnunuzi').value || 'Cash',
                jinaBidhaa: b.jina,
                idadi: idadi,
                jumla: bei * idadi,
                faida: (bei - b.beiKununua) * idadi,
                cost: b.beiKununua * idadi,
                deni: (bei * idadi) - kilicholipwa
            });
            
            saveAll();
            updateUI();
            alert('Mauzo yame rekodiwa!');
        });

        document.getElementById('btnMatumizi').addEventListener('click', function() {
            let m = {
                id: Date.now(),
                aina: document.getElementById('ainaMatumizi').value,
                kiasi: parseFloat(document.getElementById('kiasiMatumizi').value) || 0
            };
            if(!m.aina ||!m.kiasi) { alert('Jaza sehemu zote'); return; }
            matumizi.push(m);
            localStorage.setItem('pro_matumizi', JSON.stringify(matumizi));
            document.getElementById('kiasiMatumizi').value = '';
            updateUI();
            alert('Matumizi yame rekodiwa!');
        });

        function saveAll() {
            localStorage.setItem('pro_bidhaa', JSON.stringify(bidhaa));
            localStorage.setItem('pro_mauzo', JSON.stringify(mauzo));
            localStorage.setItem('pro_matumizi', JSON.stringify(matumizi));
        }

        function updateUI() {
            let leo = new Date().toDateString();
            let mauzoLeo = mauzo.filter(function(m) { return new Date(m.tarehe).toDateString() === leo; });
            document.getElementById('mauzoLeo').innerText = mauzoLeo.reduce(function(s,m) { return s + m.jumla; }, 0).toLocaleString();
            document.getElementById('faidaLeo').innerText = mauzoLeo.reduce(function(s,m) { return s + m.faida; }, 0).toLocaleString();
            document.getElementById('madeni').innerText = mauzo.reduce(function(s,m) { return s + m.deni; }, 0).toLocaleString();
            
            let mwezi = new Date().getMonth();
            let mauzoM = mauzo.filter(function(m) { return new Date(m.tarehe).getMonth() === mwezi; });
            let faidaGhafi = mauzoM.reduce(function(s,m) { return s + m.faida; }, 0);
            let jumlaMatumizi = matumizi.reduce(function(s,m) { return s + m.kiasi; }, 0);
            document.getElementById('faidaHalisi').innerText = (faidaGhafi - jumlaMatumizi).toLocaleString();

            document.getElementById('orodhaBidhaa').innerHTML = bidhaa.map(function(b) {
                return '<div class="item"><div>' + b.jina + ' - Stock: ' + b.stock + '</div><div style="color:#16a34a;font-weight:700;">TSh ' + b.beiKuuza.toLocaleString() + '</div></div>';
            }).join('') || 'Hakuna bidhaa';

            document.getElementById('chaguaBidhaa').innerHTML = '<option value="">Chagua Bidhaa</option>' +
                bidhaa.map(function(b) { return '<option value="' + b.id + '">' + b.jina + ' - Stock: ' + b.stock + '</option>'; }).join('');

            document.getElementById('chaguaBidhaa').onchange = function() {
                let b = bidhaa.find(function(x) { return x.id == this.value; });
                if(b) document.getElementById('bei').value = b.beiKuuza;
            };
        }

        updateUI();
    </script>
</body>
</html>
