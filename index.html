<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amot - Nauli Calculator Zanzibar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f4f8; padding: 15px; }
      .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { color: #1e40af; text-align: center; margin-bottom: 5px; font-size: 28px; }
      .subtitle { text-align: center; color: #64748b; margin-bottom: 20px; font-size: 14px; }
        #map { width: 100%; height: 350px; border-radius: 12px; margin-bottom: 15px; border: 2px solid #e2e8f0; }
        input, button { width: 100%; padding: 14px; margin: 8px 0; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 16px; }
        input:focus { outline: none; border-color: #2563eb; }
        button { background: #2563eb; color: white; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background: #1d4ed8; transform: translateY(-1px); }
        button:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }
      .result { background: #f8fafc; padding: 15px; border-radius: 10px; margin-top: 15px; display: none; border: 1px solid #e2e8f0; }
      .result-show { display: block; animation: fadeIn 0.3s; }
      .row { display: flex; justify-content: space-between; margin: 10px 0; }
      .label { color: #475569; }
      .value { font-weight: 600; color: #0f172a; }
      .total { font-size: 22px; color: #16a34a; }
      .error { background: #fee2e2; color: #b91c1c; padding: 12px; border-radius: 8px; margin-top: 10px; display: none; font-size: 14px; }
       @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>Amot</h1>
        <p class="subtitle">Pata nauli halisi Zanzibar</p>

        <div id="map"></div>

        <input type="text" id="pickup" placeholder="Unapoanzia - mf: Darajani">
        <input type="text" id="dropoff" placeholder="Unapoenda - mf: Airport">
        <button id="calcBtn" onclick="calculateFare()">Hesabu Nauli</button>

        <div id="error" class="error"></div>

            <div id="result" class="result">
            <div class="row">
                <span class="label">Umbali:</span>
                <span class="value" id="distance">-</span>
            </div>
            <div class="row">
                <span class="label">Muda:</span>
                <span class="value" id="duration">-</span>
            </div>
            <div class="row">
                <span class="label">Nauli ya Msingi:</span>
                <span class="value" id="baseFare">-</span>
            </div>
            <div class="row">
                <span class="label">Ada ya Huduma 15%:</span>
                <span class="value" id="serviceFee">-</span>
            </div>
            <div class="row" style="border-top: 1px solid #e2e8f0; padding-top: 10px; margin-top: 10px;">
                <span class="label">Jumla ya Nauli:</span>
                <span class="value total" id="totalFare">-</span>
            </div>

            <!-- BUTTONS ZA MALIPO ZINAANZIA HAPA -->
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="lipanaCash()" style="background:#16a34a; flex:1;">💵 Lipa Cash</button>
                <button onclick="lipanaWhatsApp()" style="background:#25D366; flex:1;">📱 Lipa M-Pesa</button>
            </div>
            <p style="text-align:center; color:#64748b; font-size:12px; margin-top:10px;">
                *Bonyeza Lipa M-Pesa kutuma order yako WhatsApp
            </p>
            <!-- BUTTONS ZINAISHIA HAPA -->
        </div>
        </div>
    </div>

    <script>
        // ========== BADILISHA HAPA TU ==========
        const API_KEY = "AIzaSyBMzrL-oUkVDU14u15itY9q5pkiDMj2NFE"; // Weka key yako hapa
        const SHEETDB_URL = "https://sheetdb.io/api/v1/yn3j4gb8hupyl"; // Weka URL ya SheetDB hapa: https://sheetdb.io/api/v1/xxxxx
        // =======================================

        let map, directionsService, directionsRenderer;
        let pickupAutocomplete, dropoffAutocomplete;

        window.initMap = function() {
            map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: -6.1659, lng: 39.2026 },
                zoom: 13,
                mapTypeControl: false,
                streetViewControl: false,
                fullscreenControl: false
            });

            directionsService = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer({
                map: map,
                suppressMarkers: false,
                polylineOptions: { strokeColor: "#2563eb", strokeWeight: 5 }
            });

            const options = { componentRestrictions: { country: "tz" }, fields: ["formatted_address", "geometry"] };
            pickupAutocomplete = new google.maps.places.Autocomplete(document.getElementById("pickup"), options);
            dropoffAutocomplete = new google.maps.places.Autocomplete(document.getElementById("dropoff"), options);
        }

        async function calculateFare() {
            const pickup = document.getElementById("pickup").value.trim();
            const dropoff = document.getElementById("dropoff").value.trim();
            const btn = document.getElementById("calcBtn");
            const errorDiv = document.getElementById("error");
            const resultDiv = document.getElementById("result");

            errorDiv.style.display = "none";
            resultDiv.classList.remove("result-show");

            if (!pickup ||!dropoff) {
                showError("Tafadhali jaza sehemu zote mbili");
                return;
            }

            if (SHEETDB_URL === "WEKA_URL_YAKO_HAPA" ||!SHEETDB_URL.includes("sheetdb.io")) {
                showError("Tafadhali weka URL sahihi ya SheetDB kwenye code kwanza");
                return;
            }

            btn.disabled = true;
            btn.textContent = "Inahesabu...";

            try {
                // 1. Pata route
                const routeResult = await new Promise((resolve, reject) => {
                    directionsService.route({
                        origin: pickup,
                        destination: dropoff,
                        travelMode: google.maps.TravelMode.DRIVING,
                    }, (result, status) => {
                        if (status === "OK" && result.routes.length) resolve(result);
                        else reject("Imeshindwa kupata njia. Hakikisha majina ya sehemu ni sahihi");
                    });
                });

                directionsRenderer.setDirections(routeResult);
                const leg = routeResult.routes[0].legs[0];
                const distanceKm = leg.distance.value / 1000;
                const durationText = leg.duration.text;

                // 2. Pata rate kutoka SheetDB
                const rateRes = await fetch(SHEETDB_URL);

                if (!rateRes.ok) throw new Error("SheetDB haipatikani. Angalia URL yako");

                const rates = await rateRes.json();

                if (!rates.length ||!rates[0].rate_per_km) {
                    throw new Error("SheetDB haina column 'rate_per_km' au haina data");
                }

                const rate = parseFloat(rates[0].rate_per_km);
                if (isNaN(rate)) throw new Error("Rate kwenye SheetDB si namba. Weka mf: 500");

                // 3. Hesabu nauli
                const baseFare = distanceKm * rate;
                const serviceFee = baseFare * 0.15;
                const totalFare = baseFare + serviceFee;

                // 4. Onyesha matokeo
                document.getElementById("distance").textContent = distanceKm.toFixed(1) + " km";
                document.getElementById("duration").textContent = durationText;
                document.getElementById("baseFare").textContent = "TSh " + Math.round(baseFare).toLocaleString();
                document.getElementById("serviceFee").textContent = "TSh " + Math.round(serviceFee).toLocaleString();
                document.getElementById("totalFare").textContent = "TSh " + Math.round(totalFare).toLocaleString();
                resultDiv.classList.add("result-show");

            } catch (err) {
                showError(err.message || err.toString());
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.textContent = "Hesabu Nauli";
            }
        }

        function showError(msg) {
            const errorDiv = document.getElementById("error");
            errorDiv.textContent = msg;
            errorDiv.style.display = "block";
        }

        // ========== FUNCTIONS ZA MALIPO ==========
        const NAMBA_YA_MTEJA_KAZI = "255779771085"; // BADILISHA HII NA NAMBA YAKO

        function lipanaCash() {
            const total = document.getElementById("totalFare").textContent;
            if (total === "-") return;
            alert(Asante kwa kutumia Amot!\n\nNauli yako: ${total}\n\nMwambie dereva bei hii na lipa cash ukifika. Safari njema!);
        }

        function lipanaWhatsApp() {
            const total = document.getElementById("totalFare").textContent;
            const pickup = document.getElementById("pickup").value;
            const dropoff = document.getElementById("dropoff").value;
            const distance = document.getElementById("distance").textContent;
            
            if (total === "-") return;

            const msg = *ORDER MPYA - AMOT*%0A%0A📍 *Kutoka:* ${pickup}%0A📍 *Kwenda:* ${dropoff}%0A🛣️ *Umbali:* ${distance}%0A💰 *Nauli:* ${total}%0A%0ANatuma order hii. Nitalipa kwa M-Pesa/Tigo Pesa.%0ANapatikana wapi?;
            
            const url = https://wa.me/${NAMBA_YA_MTEJA_KAZI}?text=${msg};
            window.open(url, '_blank');
        }
        // ========== MWISHO WA FUNCTIONS ZA MALIPO ==========
    </script>

    <!-- API Key imewekwa tayari hapa chini -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBMzrL-oUkVDU14u15itY9q5pkiDMj2NFE&libraries=places&callback=initMap" async defer></script>
</body>
</html>
